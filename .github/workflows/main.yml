name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0 flake8-isort==6.0.0

      - name: Test with flake8
        run: python -m flake8 backend/ || true

  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: tests
    env:
      IMAGE_SHA_TAG: ${{ github.sha }}
    strategy:
      matrix:
        include:
          - name: "backend"
            context: "./backend"
            image_name: "kittygram_backend"
            dockerfile: "Dockerfile"
          - name: "frontend"
            context: "./frontend"
            image_name: "kittygram_frontend"
            dockerfile: "Dockerfile"
          - name: "gateway"
            context: "./nginx"
            image_name: "kittygram_gateway"
            dockerfile: "Dockerfile"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:${{ github.sha }}
      GATEWAY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:${{ github.sha }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    needs:
      - build_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Copy compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "compose.yml"
          target: "/home/deployer01/kittygram"

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_FILE,BACKEND_IMAGE,FRONTEND_IMAGE,GATEWAY_IMAGE
          script: |
            cd /home/deployer01/kittygram
            echo $ENV_FILE > .env
            docker compose pull

            docker compose down
            docker compose up -d

            docker compose exec backend python manage.py migrate
            docker compose exec backend python manage.py collectstatic

            docker compose exec frontend cp -r /app/build/. /static

