  auto_tests:
    name: Run autotests
    runs-on: ubuntu-latest
    # needs: deploy

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "Pillow" ./backend/requirements.txt | pip install -r /dev/stdin

      - name: Test with pytest
        run: python -m pytest ./tests -v

  telegram_notify:
    runs-on: ubuntu-latest
    needs: auto_tests
    steps:
      - name: Send Telegram notification
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            EMOJI="✅"
            STATUS="успешно"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            EMOJI="❌"
            STATUS="провалился"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "cancelled" ]; then
            EMOJI="⏸️"
            STATUS="отменен"
          else
            EMOJI="⚠️"
            STATUS="завершен со статусом: ${{ github.event.workflow_run.conclusion }}"
          fi

          MESSAGE="$EMOJI <b>Деплой $STATUS</b>%0A%0A"
          MESSAGE+="📦 <b>Проект:</b> ${{ github.repository }}%0A"
          MESSAGE+="🌿 <b>Ветка:</b> ${{ github.ref_name }}%0A"
          MESSAGE+="👤 <b>Автор:</b> ${{ github.actor }}%0A"
          MESSAGE+="📝 <b>Коммит:</b> <code>${GITHUB_SHA:0:7}</code>%0A"
          MESSAGE+="⏱️ <b>Длительность:</b> $(( {{ github.event.workflow_run.run_duration_ms }} / 60000 )) мин.%0A"
          MESSAGE+="🔗 <a href='${{ github.event.workflow_run.html_url }}'>Подробности в GitHub</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"
