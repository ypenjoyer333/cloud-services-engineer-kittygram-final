name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0 flake8-isort==6.0.0

      - name: Test with flake8
        run: python -m flake8 backend/ || true

  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: tests
    env:
      IMAGE_SHA_TAG: ${{ github.sha }}
    strategy:
      matrix:
        include:
          - name: "backend"
            context: "./backend"
            image_name: "kittygram_backend"
            dockerfile: "Dockerfile"
          - name: "frontend"
            context: "./frontend"
            image_name: "kittygram_frontend"
            dockerfile: "Dockerfile"
          - name: "gateway"
            context: "./nginx"
            image_name: "kittygram_gateway"
            dockerfile: "Dockerfile"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull and deploy images
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:${{ github.sha }}
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:${{ github.sha }}
      GATEWAY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:${{ github.sha }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    needs: build_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init
          -backend-config="bucket=$S3_BUCKET"
          -backend-config="access_key=$ACCESS_KEY"
          -backend-config="secret_key=$SECRET_KEY"
        env:
          S3_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Get Terraform instance IP
        id: terraform-output
        working-directory: infra
        run: |
          INSTANCE_IP="$(terraform output -raw instance_external_ip)"

          if [ -z "$INSTANCE_IP" ]; then
            echo "Terraform output instance_external_ip is empty"
            exit 1
          fi

          echo "instance_ip=$INSTANCE_IP" >> "$GITHUB_OUTPUT"

      - name: Copy docker-compose.production.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ steps.terraform-output.outputs.instance_ip }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "/home/${{ secrets.SSH_USER }}/kittygram"

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.terraform-output.outputs.instance_ip }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_FILE,BACKEND_IMAGE,FRONTEND_IMAGE,GATEWAY_IMAGE
          script: |
            cd /home/${{ secrets.SSH_USER }}/kittygram
            echo -e $ENV_FILE > .env
            docker compose -f docker-compose.production.yml pull

            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up -d

            docker compose -f docker-compose.production.yml exec backend python manage.py migrate
            docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic --noinput

            docker compose -f docker-compose.production.yml exec frontend cp -r /app/build/. /static

  auto_tests:
    name: Run autotests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "Pillow" ./backend/requirements.txt | pip install -r /dev/stdin

      - name: Test with pytest
        run: python -m pytest ./tests -v
